[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manhua-novelizer"
version = "0.3.0"
description = "Chinese comic (manhua) PDF to novel adaptation pipeline: page scripts, narrative style config, prose, consistency audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pymupdf>=1.24", "pillow>=10"]
optional-dependencies = {"docx" = ["python-docx>=1.1"]}

[project.scripts]
mnv = "manhua_novelizer.cli:main"

[tool.setuptools.packages.find]
include = ["manhua_novelizer*"]
